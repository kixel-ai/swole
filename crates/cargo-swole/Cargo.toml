[package]
name = "cargo-swole"
description = "Count each benchmark's instructions under stock Valgrind or with perf counters, in parallel, and time them with every counter, paired with a base commit's"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Installed through the flake, or with `cargo install --git`, until first publish.
publish = false

# One program under two names: `swole` on its own, and `cargo swole` as Cargo runs a subcommand.
[[bin]]
name = "swole"
path = "src/bin/swole.rs"

[[bin]]
name = "cargo-swole"
path = "src/bin/cargo-swole.rs"

[dependencies]
serde_json = "1.0.154"
toml = "1.1.8"

[lints]
workspace = true
