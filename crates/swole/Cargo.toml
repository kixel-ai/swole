[package]
name = "swole"
description = "Benchmarks as plain functions marked #[bench], counted under Valgrind and timed by swole"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# A git dependency until first publish.
publish = false

[dependencies]
inventory = "0.3.25"
swole-macros = { path = "../swole-macros" }

[[bench]]
name = "fixture"
harness = false

# Allocations counted beside a global allocator that counts them too.
[[bench]]
name = "allocs"
harness = false

# A global allocator that never reaches malloc.
[[bench]]
name = "bypass"
harness = false

[lints]
workspace = true
